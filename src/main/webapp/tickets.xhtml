<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Ticket Support</title>
    <h:outputStylesheet library="css" name="common.css" />
    <h:outputStylesheet library="css" name="tickets.css" />
</h:head>

<h:body>
    <ui:include src="/WEB-INF/fragments/header.xhtml" />

    <div class="container">
        <h:messages globalOnly="true" styleClass="form-messages" infoClass="message-info"
                    errorClass="message-error" />
        <!-- FILTERS -->
        <div class="card">
            <h:form>
                <div class="filters">
                    <div class="filter-group">
                        <h:outputLabel for="emailInput" value="Customer Email" />
                        <h:inputText id="emailInput" value="#{ticketListBean.email}" pt:placeholder="Part of email" />
                    </div>

                    <div class="filter-group">
                        <label for="statusSelect">Status</label>
                        <h:selectOneMenu id="statusSelect" value="#{ticketListBean.status}">
                            <f:selectItem itemLabel="All Statuses" itemValue="#{null}" />
                            <f:selectItems value="#{ticketListBean.availableStatuses}" var="s"
                                           itemLabel="#{s}" itemValue="#{s}" />
                        </h:selectOneMenu>
                    </div>

                    <div class="filter-group">
                        <label for="prioritySelect">Priority</label>
                        <h:selectOneMenu id="prioritySelect" value="#{ticketListBean.priority}">
                            <f:selectItem itemLabel="All Priorities" itemValue="#{null}" />
                            <f:selectItems value="#{ticketListBean.availablePriorities}" var="p"
                                           itemLabel="#{p}" itemValue="#{p}" />
                        </h:selectOneMenu>
                    </div>

                    <div class="filter-group filter-actions">
                        <h:commandButton value="Search" styleClass="btn btn-primary" action="#{ticketListBean.search}" />
                        <h:commandButton value="Reset" styleClass="btn btn-secondary" action="#{ticketListBean.resetFilters}" />
                    </div>
                </div>
            </h:form>
        </div>

        <!-- TABLE CARD -->
        <div class="card table-card">
            <h:form id="ticketForm">
                <!-- Table Grid -->
                <div class="table-container">
                    <h:dataTable value="#{ticketListBean.tickets}" var="ticket"
                                 styleClass="ticket-table" headerClass="table-header">
                        <h:column>
                            <f:facet name="header">ID</f:facet>
                            <h:link value="#{ticket.ticketId}" outcome="ticket-detail">
                                <f:param name="ticketId" value="#{ticket.ticketId}" />
                            </h:link>
                        </h:column>

                        <h:column>
                            <f:facet name="header">Email</f:facet>
                            <h:outputText value="#{ticket.customerEmail}" />
                        </h:column>

                        <h:column>
                            <f:facet name="header">Purchase Date</f:facet>
                            #{ticket.dateOfPurchase}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Subject</f:facet>
                            <h:outputText value="#{ticket.subject}" />
                        </h:column>

                        <h:column>
                            <f:facet name="header">Status</f:facet>
                            <span class="badge status-#{ticket.status}">#{ticket.status}</span>
                        </h:column>

                        <h:column>
                            <f:facet name="header">Priority</f:facet>
                            <span class="badge priority-#{ticket.priority}">#{ticket.priority}</span>
                        </h:column>
                    </h:dataTable>
                </div>

                <h:panelGroup layout="block" styleClass="empty-state"
                              rendered="#{empty ticketListBean.tickets}">
                    No tickets found.
                </h:panelGroup>

                <!-- PAGINATION (Visually separated outside the table grid) -->
                <h:panelGroup layout="block" styleClass="pagination-footer"
                              rendered="#{ticketListBean.ticketPage.totalPages > 0}">
                    <h:commandButton value="← Previous"
                                     styleClass="btn btn-secondary"
                                     action="#{ticketListBean.prevPage}"
                                     disabled="#{!ticketListBean.hasPrev}" />

                    <h:outputText styleClass="pagination-info"
                                  value="Page #{ticketListBean.currentPage + 1} of #{ticketListBean.ticketPage.totalPages}" />

                    <h:commandButton value="Next →"
                                     styleClass="btn btn-primary"
                                     action="#{ticketListBean.nextPage}"
                                     disabled="#{!ticketListBean.hasNext}" />
                </h:panelGroup>
            </h:form>
        </div>
    </div>

</h:body>
</html>
